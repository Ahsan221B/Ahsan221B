name: Profile stats
# Optional: add a fine-grained token as the STATS_TOKEN secret to count private repo languages.
on:
  schedule:
    - cron: "41 3 * * *"   # daily, 08:41 Pakistan time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/stats.py assets
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name "Ahsan Mustafa"
          git config user.email "iahsanmustafa@gmail.com"
          git add assets
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
